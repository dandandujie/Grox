[package]
name = "grox-desktop"
version = "0.2.11"
description = "Grox desktop agent powered by Grok Build"
edition = "2021"
rust-version = "1.77"

# Keep this crate OUT of the grok-build workspace (root Cargo.toml is
# auto-generated and treated as read-only). The empty table makes this
# project its own workspace root.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
url = "2"
base64 = "0.22"
getrandom = "0.3"
percent-encoding = "2"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
toml_edit = "0.20.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
uiautomation = { version = "0.25", default-features = false, features = ["input", "control", "pattern", "screenshot", "process"] }
